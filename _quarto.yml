project:
  type: website
  output-dir: _site

  # Slides are deliberately absent from this list. The revealjs decks were
  # rendered in 2022 and are preserved as-is by the deploy workflow, which also
  # carries over site_libs/revealjs. Adding them here would re-execute all the
  # slide R code; see .github/workflows/build-site.yml.
  render:
    - "index.qmd"
    - "about.qmd"
    - "slides.qmd"
    - "exercises.qmd"
    - "resources.qmd"
    - "topics/*.qmd"
    - "bundles/*.qmd"
    - "ae/**/*.Rmd"
    - "ae/**/*.rmd"
    # These four still carry 2022 code that current versions of
    # marginaleffects / ggeffects / modelsummary reject. The first two keep
    # their preserved 2022 output (restored by the deploy workflow); the two
    # ae12 solutions have no preserved output and are not linked in the nav.
    - "!ae/ae04-multiple-regression-part-1/ae04-02-MLR-linearity.Rmd"
    - "!ae/ae06-multiple-regression-part-3/ae06-01-interaction-terms-toolbox.rmd"
    - "!ae/ae12-iv/ae12-iv-solutions.Rmd"
    - "!ae/ae12-iv/ae12-iv-solutions-2.Rmd"

  # Quarto only copies resources it sees referenced, which is why no .zip ever
  # reached the deployed site. Declaring them explicitly fixes the downloads.
  resources:
    - "ae/**/*.zip"
    - "ae/**/data/**"
    - "ae/**/tinytable_assets/**"
    - "img/**"

