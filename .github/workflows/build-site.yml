name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # ak91.dta and Ghana_Firms_JDE04.dta are stored in Git LFS. Without
          # this they check out as ~130-byte pointer files, which would be
          # zipped into the bundles and published as the datasets themselves.
          lfs: true

      # Only the slide decks are taken from the deployed branch; they are 91 MB
      # and not worth carrying in the source repo. Everything else the 2022
      # output needs lives under _preserved/ in the repo, because recovering it
      # from the branch this job overwrites is circular - one bad deploy erases
      # the only copy.
      #
      # actions/checkout only accepts a path inside the workspace, so this lands
      # in the project and is moved out immediately. Left in place it counts as
      # project content and its img/ folders get published under /_preserved/.
      - name: Check out the deployed site (for the slide decks)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: _ghpages_checkout

      - name: Move the gh-pages checkout out of the project
        run: |
          set -euo pipefail
          if [ -d _ghpages_checkout ]; then
            rm -rf "${{ runner.temp }}/ghpages"
            mv _ghpages_checkout "${{ runner.temp }}/ghpages"
            echo "moved to ${{ runner.temp }}/ghpages"
          else
            echo "::warning::gh-pages checkout did not happen"
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Every exercise that still renders has a committed _freeze/ result, so
      # Quarto reuses it and executes no R here. R is installed only because the
      # knitr engine is declared; no package restore is needed or wanted.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr and rmarkdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Rebuild downloadable project bundles
        run: python3 scripts/build-bundles.py

      - name: Render site
        run: quarto render

      # site_libs cannot be regenerated here: no revealjs document is rendered,
      # and current Quarto no longer emits the asset names the 2022 pages
      # reference (bootstrap.min.css, kePrint, lightable, the older
      # quarto-html files). Current Quarto hashes its bootstrap filenames, so
      # the 2022 and current assets coexist without colliding. Also carries the
      # two exercise pages excluded from the render list in _quarto.yml.
      - name: Copy vendored 2022 assets
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -rn _preserved/. _site/ || true
          echo "copied $(find _preserved -type f | wc -l) vendored files"

      - name: Restore the slide decks from the deployed site
        env:
          GHPAGES: ${{ runner.temp }}/ghpages
        run: |
          set -euo pipefail
          if [ -d "$GHPAGES/slides" ]; then
            mkdir -p _site/slides
            cp -r "$GHPAGES/slides/." _site/slides/
            echo "restored $(find _site/slides -name '*.html' | wc -l) slide decks"
          else
            echo "::warning::No slides in the gh-pages checkout."
          fi

      - name: Drop references to assets that were never produced
        run: python3 scripts/strip-dangling-images.py

      - name: Check that nothing is missing
        run: |
          set -euo pipefail
          fail=0
          for f in index.html slides.html exercises.html resources.html about.html \
                   slides/60-iv/iv.html \
                   slides/00-introduction/00-introduction.html \
                   ae/ae12-iv/ae12-iv.html \
                   ae/ae04-multiple-regression-part-1/ae04-02-MLR-linearity.html \
                   ae/ae06-multiple-regression-part-3/ae06-01-interaction-terms-toolbox.html \
                   ae/ae03-data-wrangling.zip \
                   site_libs/revealjs/dist/reveal.js \
                   site_libs/bootstrap/bootstrap.min.css \
                   site_libs/kePrint-0.0.1/kePrint.js
          do
            if [ ! -e "_site/$f" ]; then echo "::error::missing _site/$f"; fail=1; fi
          done

          # 15 decks in 2022; fewer means the carry-forward silently dropped some.
          decks=$(find _site/slides -name '*.html' 2>/dev/null | wc -l)
          if [ "$decks" -ne 15 ]; then
            echo "::error::expected 15 slide decks, found $decks"; fail=1
          fi

          # Neither checkout may end up inside the published site.
          for leak in _site/_preserved _site/_ghpages_checkout; do
            if [ -e "$leak" ]; then
              echo "::error::$leak exists: a checkout leaked into the build"; fail=1
            fi
          done

          # An LFS pointer published as a dataset is worse than a missing file,
          # because nothing looks wrong until a student opens it.
          for dta in _site/ae/ae12-iv/data/ak91.dta \
                     _site/ae/ae11-panel-regression-part-2/data/Ghana_Firms_JDE04.dta
          do
            if head -c 40 "$dta" 2>/dev/null | grep -q 'git-lfs'; then
              echo "::error::$dta is an LFS pointer, not the dataset"; fail=1
            fi
          done

          echo "slide decks: $decks"
          echo "exercises:   $(find _site/ae -name '*.html' 2>/dev/null | wc -l)"
          echo "bundles:     $(find _site/ae -maxdepth 1 -name '*.zip' 2>/dev/null | wc -l)"
          exit $fail

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
